<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
  width="1280" height="720" viewBox="0 0 1280 720"
  font-family="OPPOSans R, Microsoft YaHei, sans-serif"
  data-pptx-master="sam_bain_master" data-pptx-master-name="Sam Bain"
  data-pptx-layout="chapter" data-pptx-layout-name="章节页">
  <defs>
    <linearGradient id="chapter-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16365F" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#1C4274" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#1C4274" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect id="master-background" x="0" y="0" width="1280" height="720" fill="#FFFFFF"
    data-pptx-layer="master" data-pptx-editable="false"/>
  <rect id="chapter-background" x="0" y="0" width="1280" height="720" fill="#1C4274"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <image id="chapter-photo" x="0" y="0" width="1280" height="720"
    href="../images/chapter-city.jpg" preserveAspectRatio="xMidYMid slice"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="chapter-photo-fade" x="0" y="0" width="1280" height="720" fill="url(#chapter-fade)"
    data-pptx-layer="layout" data-pptx-editable="false"/>
  <rect id="chapter-accent" x="80" y="392" width="72" height="6" fill="#A23424"
    data-pptx-layer="layout" data-pptx-editable="false"/>

  <g id="number-slot" data-pptx-placeholder="body" data-pptx-idx="1" data-pptx-bounds="80 216 480 172">
    <text id="number-carrier" data-pptx-carrier="true" x="80" y="340"
      fill="#C4D7F1" font-family="OPPOSans B, Microsoft YaHei, sans-serif"
      font-size="112">{{CHAPTER_NUM}}</text>
  </g>
  <g id="title-slot" data-pptx-placeholder="title" data-pptx-bounds="80 404 1000 68">
    <text id="title-carrier" data-pptx-carrier="true" x="80" y="454"
      fill="#FFFFFF" font-family="OPPOSans H, Microsoft YaHei, sans-serif"
      font-size="44">{{CHAPTER_TITLE}}</text>
  </g>
  <g id="desc-slot" data-pptx-placeholder="body" data-pptx-idx="2" data-pptx-bounds="80 486 1000 40">
    <text id="desc-carrier" data-pptx-carrier="true" x="80" y="512"
      fill="#C4D7F1"
      font-size="21.33">{{CHAPTER_DESC}}</text>
  </g>
</svg>
